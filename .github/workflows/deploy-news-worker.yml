name: Deploy news API Worker

on:
  push:
    branches: [main]
    paths:
      - 'news-worker/**'
      - '.github/workflows/deploy-news-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-news-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "Missing CLOUDFLARE_API_TOKEN secret" >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret" >&2; exit 1; }

      - name: Resolve D1 database and generate Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 d1 list --json > "$RUNNER_TEMP/d1.json"

          database_id="$(
            python3 - "$RUNNER_TEMP/d1.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          for item in data:
              if item.get("name") == "liangzai-news-prod":
                  print(item["uuid"])
                  break
          else:
              raise SystemExit("D1 database liangzai-news-prod was not found")
          PY
          )"

          cat > "$RUNNER_TEMP/wrangler-news.jsonc" <<EOF
          {
            "name": "liangzai-news-api",
            "main": "${GITHUB_WORKSPACE}/news-worker/index.js",
            "compatibility_date": "2026-09-30",
            "keep_vars": true,
            "workers_dev": true,
            "triggers": { "crons": ["*/30 * * * *"] },
            "observability": { "enabled": true, "logs": { "enabled": true, "invocation_logs": false }, "traces": { "enabled": false } },
            "routes": [
              {
                "pattern": "api.wangyibiao.com",
                "custom_domain": true
              }
            ],
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "liangzai-news-prod",
                "database_id": "$database_id",
                "migrations_dir": "${GITHUB_WORKSPACE}/news-worker/migrations"
              }
            ]
          }
          EOF

      - name: Apply subscription schema
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 d1 migrations apply liangzai-news-prod --remote --config "$RUNNER_TEMP/wrangler-news.jsonc"

      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config "$RUNNER_TEMP/wrangler-news.jsonc"

      - name: Verify news API
        shell: bash
        run: |
          set -euo pipefail
          # New routes can take a few seconds to propagate after deployment.
          robot_ready=false
          for attempt in {1..8}; do
            response="$(curl --silent --show-error --max-time 15 https://api.wangyibiao.com/api/robot-subscriptions)"
            if python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["review_required"] is True and d["mentions_admin_only"] is True' <<< "$response" 2>/dev/null; then
              robot_ready=true
              break
            fi
            sleep 5
          done
          [[ "$robot_ready" == "true" ]] || { echo "Robot subscription route is not ready" >&2; exit 1; }
          for url in \
            "https://api.wangyibiao.com/api/health" \
            "https://api.wangyibiao.com/api/subscriptions" \
            "https://api.wangyibiao.com/api/robot-subscriptions" \
            "https://api.wangyibiao.com/api/news/featured?limit=6" \
            "https://api.wangyibiao.com/api/news/editions?page=1&pageSize=1"; do
            echo "Checking $url"
            response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 "$url")"
            python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          if "/api/health" in sys.argv[1]:
              assert payload["robot_ready"] is True, "Robot subscription encryption must be configured"
              print("Robot subscriptions configured:", payload["robot_ready"])
          if "/api/robot-subscriptions" in sys.argv[1]:
              assert payload["review_required"] is True and payload["mentions_admin_only"] is True
          if "/api/subscriptions" in sys.argv[1]:
              assert payload["review_required"] is True, "Subscription review must be required"
              assert payload["email_confirmation_required"] is True, "Email confirmation must be required"
              print("Newsletter mail configured:", payload["mail_ready"])
          if "/api/news/editions" in sys.argv[1]:
              assert payload["meta"]["pageSize"] == 1, "Expected one day per page"
              assert len(payload["data"]) <= 1, "Multiple dates returned on one page"
              assert payload["meta"]["totalPages"] == max(1, payload["meta"]["totalDays"]), "Page count must match edition dates"
          ' "$url" <<< "$response"
          done

      - name: Verify robot delivery service
        env:
          NEWS_ADMIN_TOKEN: ${{ secrets.NEWS_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$NEWS_ADMIN_TOKEN" ]] || { echo "Missing news administrator secret" >&2; exit 1; }
          response="$(curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $NEWS_ADMIN_TOKEN" \
            https://api.wangyibiao.com/api/admin/robot/status)"
          python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["enabled"] is True; assert data["review_required"] is True; assert "subscriptions" in data; print("Robot application schema and approval requirement verified")' <<< "$response"
