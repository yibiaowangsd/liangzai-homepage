name: Deploy news API Worker

on:
  push:
    branches: [main]
    paths:
      - 'news-worker/**'
      - 'news/edition-policy.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-news-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve D1 database and generate Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 d1 list --json > "$RUNNER_TEMP/d1.json"

          database_id="$(
            python3 - "$RUNNER_TEMP/d1.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          for item in data:
              if item.get("name") == "liangzai-news-prod":
                  print(item["uuid"])
                  break
          else:
              raise SystemExit("D1 database liangzai-news-prod was not found")
          PY
          )"

          cat > "$RUNNER_TEMP/wrangler-news.jsonc" <<EOF
          {
            "name": "liangzai-news-api",
            "main": "${GITHUB_WORKSPACE}/news-worker/index.js",
            "compatibility_date": "2026-09-30",
            "keep_vars": true,
            "workers_dev": true,
            "triggers": { "crons": ["10,40 * * * *"] },
            "observability": { "enabled": true, "logs": { "enabled": true, "invocation_logs": true }, "traces": { "enabled": true, "head_sampling_rate": 0.1 } },
            "vars": { "NEWS_RELEASE_SHA": "${GITHUB_SHA}" },
            "ratelimits": [
              { "name": "NEWS_READ_LIMITER", "namespace_id": "1101", "simple": { "limit": 120, "period": 60 } },
              { "name": "NEWS_SEARCH_LIMITER", "namespace_id": "1102", "simple": { "limit": 12, "period": 60 } },
              { "name": "NEWS_SEARCH_MISS_LIMITER", "namespace_id": "1103", "simple": { "limit": 30, "period": 60 } }
            ],
            "routes": [
              {
                "pattern": "api.wangyibiao.com",
                "custom_domain": true
              }
            ],
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "liangzai-news-prod",
                "database_id": "$database_id",
                "migrations_dir": "${GITHUB_WORKSPACE}/news-worker/migrations"
              }
            ]
          }
          EOF

      - name: Test news publishing
        run: node --experimental-strip-types --test tests/news-editions-api.test.mjs tests/news-edition-publishing.test.mjs

      - name: Apply news and subscription schema
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 d1 migrations apply liangzai-news-prod --remote --config "$RUNNER_TEMP/wrangler-news.jsonc"

      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config "$RUNNER_TEMP/wrangler-news.jsonc"

      - name: Verify deployed API
        run: |
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 20 \
            https://api.wangyibiao.com/api/health \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True and data.get("database") is True'
