name: Check frontend changes

on:
  pull_request:
    paths:
      - 'app/**'
      - 'public/**'
      - 'news-worker/**'
      - 'news/topics.js'
      - 'news/edition-policy.json'
      - 'news/validate-edition.py'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/news-frontend-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --experimental-strip-types --test tests/news-editions-api.test.mjs tests/news-edition-publishing.test.mjs
