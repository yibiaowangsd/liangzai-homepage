name: Validate news and laboratory frontend

on:
  push:
    branches: [main]
    paths:
      - 'app/news/**'
      - 'public/assets/site-navigation.css'
      - 'public/pqc-practice/**'
      - 'tests/browser-compat.test.mjs'
      - 'tests/kex-worker-flow.test.mjs'
      - 'app/experience/NewsGate.tsx'
      - 'app/experience/news-gate.css'
      - 'app/experience/news-gate-modal.ts'
      - 'app/experience/AboutPushTransition.tsx'
      - 'app/experience/PageArrival.tsx'
      - 'app/experience/about-push*'
      - 'app/experience/page-arrival.ts'
      - 'tests/page-arrival.test.mjs'
      - 'tests/about-push-image.test.mjs'
      - 'tests/news-*.test.mjs'
      - 'news/validate-edition.py'
      - 'app/page.tsx'
      - 'app/layout.tsx'
      - 'public/news-covers/**'
      - '.github/workflows/news-frontend-check.yml'
  pull_request:
    paths:
      - 'app/news/**'
      - 'public/assets/site-navigation.css'
      - 'public/pqc-practice/**'
      - 'tests/browser-compat.test.mjs'
      - 'tests/kex-worker-flow.test.mjs'
      - 'app/experience/NewsGate.tsx'
      - 'app/experience/news-gate.css'
      - 'app/experience/news-gate-modal.ts'
      - 'app/experience/AboutPushTransition.tsx'
      - 'app/experience/PageArrival.tsx'
      - 'app/experience/about-push*'
      - 'app/experience/page-arrival.ts'
      - 'tests/page-arrival.test.mjs'
      - 'tests/about-push-image.test.mjs'
      - 'tests/news-*.test.mjs'
      - 'news/validate-edition.py'
      - 'app/page.tsx'
      - 'app/layout.tsx'
      - 'public/news-covers/**'
      - '.github/workflows/news-frontend-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 news/validate-edition.py news/inbox/*.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node --experimental-strip-types --test tests/news-*.test.mjs tests/page-arrival.test.mjs tests/about-push-image.test.mjs tests/browser-compat.test.mjs tests/kex-worker-flow.test.mjs
