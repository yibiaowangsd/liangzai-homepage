name: NGCC submitted-source WASM rebuild

on:
  push:
    branches: [feat/ngcc-more-wasm]
    paths:
      - '.github/workflows/ngcc-wasm-rebuild.yml'
      - 'scripts/build-ngcc-expanded.py'
      - 'scripts/check-ngcc-module.mjs'
      - 'scripts/ngcc-wasm-bridge.c'
      - 'scripts/ngcc-wasm-introspect.mk'
      - 'tests/fixtures/ngcc-hash01.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kem-sign-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NGCC_IDS: 'kem-02 kem-03 sign-03 sign-04'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ngcc-dev/ngcc-harness
          ref: c5261784ef27e7363b1bbace3d687932fda35ccd
          path: ngcc-harness
          sparse-checkout: |
            /api/
            /kem-02/
            /kem-03/
            /sign-03/
            /sign-04/
          sparse-checkout-cone-mode: false
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.10'
      - name: Check each native reference implementation and build WASM
        run: |
          mkdir -p work/ngcc-wasm-rebuild
          make -s -C ngcc-harness/api harness
          for id in $NGCC_IDS; do
            echo "Attempting ${id}"
            if ! timeout 90 make -s -C "ngcc-harness/$id" -j2 test > "work/ngcc-wasm-rebuild/$id.native.log" 2>&1; then
              echo "Native KAT failed or exceeded 90 seconds: $id"
              continue
            fi
            if [[ $id == hash-* ]]; then
              timeout 30 python3 scripts/ngcc-native-hash-vectors.py ngcc-harness "$id" > "work/ngcc-wasm-rebuild/$id.vectors.log" 2>&1
            fi
            make -s -C "ngcc-harness/$id" clean
            python3 scripts/build-ngcc-expanded.py ngcc-harness "$id" --seconds 90
            cp work/ngcc-wasm-rebuild/results.json "work/ngcc-wasm-rebuild/$id.results.json"
          done
      - name: Preserve individual build and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngcc-kem-sign-pilot-logs
          path: work/ngcc-wasm-rebuild/
          if-no-files-found: ignore
      - name: Commit verified browser modules to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/pqc-practice/wasm/
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified NGCC KEM and signature reference WASM'
            git push origin HEAD:feat/ngcc-more-wasm
          fi
