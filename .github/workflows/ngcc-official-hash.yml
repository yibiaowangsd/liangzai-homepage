name: Build missing NGCC hashes from verified official archives

on:
  push:
    branches: [feat/ngcc-official-hashes]
    paths:
      - '.github/workflows/ngcc-official-hash.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: hash-06
            ids: hash-06
          - name: hash-07
            ids: hash-07
          - name: hash-08
            ids: hash-08
          - name: hash-13
            ids: hash-13
          - name: hash-15
            ids: hash-15
          - name: hash-16
            ids: hash-16
          - name: hash-23
            ids: hash-23
          - name: hash-28
            ids: hash-28
          - name: hash-29
            ids: hash-29
          - name: hash-30
            ids: hash-30
          - name: hash-33
            ids: hash-33
          - name: hash-34
            ids: hash-34
    env:
      NGCC_NATIVE_SECONDS: 75
      NGCC_NATIVE_BUDGET: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ngcc-dev/ngcc-harness
          ref: c5261784ef27e7363b1bbace3d687932fda35ccd
          path: ngcc-harness
          sparse-checkout: |
            /api/
            /${{ matrix.ids }}/
          sparse-checkout-cone-mode: false
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.10'
      - name: Download, checksum and stage official reference source and KAT
        run: python3 scripts/stage-ngcc-official.py "${{ matrix.ids }}" ngcc-harness
      - name: Native KAT and bounded per-parameter WASM build
        run: bash scripts/run-ngcc-batch.sh "${{ matrix.ids }}" ngcc-harness
      - name: Record the checksum-verified submission source
        if: always()
        run: |
          python3 - "${{ matrix.ids }}" <<'PY'
          import json, sys
          from pathlib import Path
          candidate_id = sys.argv[1]
          record = Path('work/ngcc-wasm-rebuild') / (candidate_id + '.results.json')
          if record.is_file():
              source = json.loads(Path('scripts/ngcc-official-archives.json').read_text())['candidates'][candidate_id]
              rows = json.loads(record.read_text())
              for row in rows:
                  if row['status'] == 'verified':
                      row.update(validation='official_kat_native_wasm', source_url=source['url'],
                                 source_sha256=source['sha256'])
              record.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Package checked outputs and failure logs
        if: always()
        shell: bash
        run: |
          mkdir -p work/ngcc-package/public/pqc-practice/wasm work/ngcc-package/work
          for path in public/pqc-practice/wasm/ngcc-${{ matrix.ids }}-*.mjs public/pqc-practice/wasm/ngcc-${{ matrix.ids }}-*.wasm; do
            if [[ -f $path ]]; then cp "$path" work/ngcc-package/public/pqc-practice/wasm/; fi
          done
          if [[ -d work/ngcc-wasm-rebuild ]]; then cp -a work/ngcc-wasm-rebuild work/ngcc-package/work/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngcc-official-${{ matrix.name }}
          path: work/ngcc-package/
          if-no-files-found: ignore

  publish:
    needs: rebuild
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ngcc-official-hashes
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: 'ngcc-official-*'
          merge-multiple: true
          path: .
      - name: Publish verified pairs and updated audit only
        run: |
          python3 scripts/aggregate-ngcc-rebuild.py
          node --test tests/ngcc-catalog.test.mjs
          node --check public/pqc-practice/ngcc-hash-runtime.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/pqc-practice/wasm/ public/pqc-practice/ngcc-runtime.js public/pqc-practice/ngcc-hash-runtime.js public/pqc-practice/ngcc-kex-runtime.js public/pqc-practice/ngcc-build-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish official NGCC hash source builds and audit'
            git push origin HEAD:feat/ngcc-official-hashes
          fi
