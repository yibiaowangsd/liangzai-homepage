name: Verify robot duplicate guard without group messages
on:
  push:
    branches: ['verify/robot-duplicate-guard-20261009']
    paths: ['.github/workflows/robot-duplicate-guard-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEWS_ADMIN_TOKEN: ${{ secrets.NEWS_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify migrated tables and an absent test target
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 d1 list --json > "$RUNNER_TEMP/d1.json"
          python3 - "$RUNNER_TEMP/d1.json" "$RUNNER_TEMP/config.json" <<'PY'
          import json,sys
          db=next(x for x in json.load(open(sys.argv[1])) if x["name"]=="liangzai-news-prod")
          json.dump({"name":"robot-guard-verification","compatibility_date":"2026-09-30","d1_databases":[{"binding":"DB","database_name":db["name"],"database_id":db["uuid"]}]},open(sys.argv[2],"w"))
          PY
          npx --yes wrangler@4.92.0 d1 execute liangzai-news-prod --remote --config "$RUNNER_TEMP/config.json" --json --command "SELECT (SELECT count(*) FROM sqlite_master WHERE name IN ('robot_manual_deliveries','robot_manual_receipts','robot_manual_active')) AS schema_count,(SELECT count(*) FROM robot_subscribers WHERE id='00000000-0000-4000-8000-000000000000') AS test_target_count;" > "$RUNNER_TEMP/schema.json"
      - name: Verify new API rejects legacy requests without sending a message
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const rows=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/schema.json','utf8')).flatMap(report=>report.results||[]);
          if(rows.length!==1||rows[0].schema_count!==3||rows[0].test_target_count!==0)throw new Error('Schema or test target verification failed');
          const response=await fetch('https://api.wangyibiao.com/api/admin/robot/send',{
            method:'POST',redirect:'error',signal:AbortSignal.timeout(15000),
            headers:{'Content-Type':'application/json',Authorization:'Bearer '+process.env.NEWS_ADMIN_TOKEN},
            body:JSON.stringify({subscriber_id:'00000000-0000-4000-8000-000000000000',part:0})
          });
          console.log('ROBOT_DUPLICATE_GUARD '+JSON.stringify({schema_ready:true,test_target_absent:true,http_status:response.status,missing_batch_rejected:response.status===400}));
          if(response.status!==400)throw new Error('Updated batch validation is not active');
          JS
