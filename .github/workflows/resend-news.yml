name: Resend a reviewed news edition

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Existing reviewed request, e.g. news/resend/2026-10-19.json'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: news-resend
  cancel-in-progress: false

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Select reviewed request
        env:
          REQUEST_FILE: ${{ inputs.request_file }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUEST_FILE" =~ ^news/resend/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$ ]] || { echo "Invalid request path" >&2; exit 1; }
          [[ -f "$REQUEST_FILE" ]] || { echo "Request file does not exist" >&2; exit 1; }
          echo "NEWS_RESEND_REQUEST=$REQUEST_FILE" >> "$GITHUB_ENV"
      - name: Check the reviewed edition
        run: node scripts/resend-news.mjs "$NEWS_RESEND_REQUEST" --check
      - name: Send or resume the reviewed batch
        env:
          NEWS_ADMIN_TOKEN: ${{ secrets.NEWS_ADMIN_TOKEN }}
        run: node scripts/resend-news.mjs "$NEWS_RESEND_REQUEST"
