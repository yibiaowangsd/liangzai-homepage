name: Verify one approved robot digest
on:
  push:
    branches: ['verify/robot-manual-send-20261009']
    paths: ['.github/workflows/robot-manual-once.yml']
permissions:
  contents: read
concurrency:
  group: robot-manual-once-20261009
  cancel-in-progress: false
jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEWS_ADMIN_TOKEN: ${{ secrets.NEWS_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve the approved group without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]] || { echo "This real delivery has already been attempted; do not rerun"; exit 1; }
          npx --yes wrangler@4.92.0 d1 list --json > "$RUNNER_TEMP/d1.json"
          python3 - "$RUNNER_TEMP/d1.json" "$RUNNER_TEMP/manual-config.json" <<'PY'
          import json,sys
          db=next(x for x in json.load(open(sys.argv[1])) if x["name"]=="liangzai-news-prod")
          json.dump({"name":"robot-manual-check","compatibility_date":"2026-09-30","d1_databases":[{"binding":"DB","database_name":db["name"],"database_id":db["uuid"]}]},open(sys.argv[2],"w"))
          PY
          npx --yes wrangler@4.92.0 d1 execute liangzai-news-prod --remote --config "$RUNNER_TEMP/manual-config.json" --json --command "SELECT id FROM robot_subscribers WHERE status='approved' AND created_at='2026-10-09 08:59:34' LIMIT 2;" > "$RUNNER_TEMP/manual-target.json"
      - name: Send one complete digest through the production administrator API
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const reports=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/manual-target.json','utf8'));
          const rows=reports.flatMap(report=>report.results||[]);
          if(rows.length!==1)throw new Error('Expected exactly one approved target; no message sent');
          let step={part:0}; let completed=false; let sent=0;
          for(let count=0;count<5;count++){
            const response=await fetch('https://api.wangyibiao.com/api/admin/robot-subscriptions/'+rows[0].id+'/send',{
              method:'POST',redirect:'error',signal:AbortSignal.timeout(45000),
              headers:{'Content-Type':'application/json',Authorization:'Bearer '+process.env.NEWS_ADMIN_TOKEN},
              body:JSON.stringify(step)
            });
            const result=await response.json(); const p=result.provider||{};
            const provider={http_status:p.http_status,ok:typeof p.ok==='boolean'?p.ok:undefined,
              success:typeof p.success==='boolean'?p.success:undefined,code:/^-?\d{1,9}$/.test(p.code||'')?p.code:undefined};
            console.log('ROBOT_MANUAL_RESULT '+JSON.stringify({api_http_status:response.status,part:step.part,
              ok:result.ok,sent:result.sent,more:result.more,total:result.total,error_code:result.error_code,provider}));
            if(!response.ok||result.ok!==true||result.sent!==1)throw new Error('Digest delivery was not acknowledged; stopping without automatic retry');
            sent+=result.sent;
            if(!result.more){completed=true;break;}
            if(result.next_part!==step.part+1||typeof result.version!=='string'||typeof result.date!=='string')throw new Error('Unexpected continuation; stopping');
            step={part:result.next_part,version:result.version,date:result.date};
          }
          if(!completed)throw new Error('Digest did not complete in the allowed five selected sections');
          console.log('ROBOT_MANUAL_COMPLETE '+JSON.stringify({completed,sent}));
          JS
