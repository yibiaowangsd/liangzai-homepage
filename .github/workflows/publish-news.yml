name: Publish news to Cloudflare D1

on:
  push:
    branches: [main]
    paths:
      - 'news/inbox/*.json'
      - '.github/workflows/publish-news.yml'
  workflow_dispatch:
    inputs:
      file:
        description: 'Optional news JSON path, e.g. news/inbox/2026-10-01.json'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEWS_API_URL: https://api.wangyibiao.com/api/admin/news/batch
      NEWS_ADMIN_TOKEN: ${{ secrets.NEWS_ADMIN_TOKEN }}
      EVENT_NAME: ${{ github.event_name }}
      INPUT_FILE: ${{ inputs.file || '' }}
      BEFORE_SHA: ${{ github.event.before || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select news files
        id: select
        shell: bash
        run: |
          set -euo pipefail

          files=()

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_FILE" ]]; then
            if [[ ! "$INPUT_FILE" =~ ^news/inbox/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$ ]]; then
              echo "Invalid input path: $INPUT_FILE" >&2
              exit 1
            fi
            files+=("$INPUT_FILE")
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            latest="$(find news/inbox -maxdepth 1 -type f -name '*.json' -print 2>/dev/null | sort | tail -n 1 || true)"
            if [[ -n "$latest" ]]; then
              files+=("$latest")
            fi
          else
            if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              while IFS= read -r file; do
                [[ -n "$file" ]] && files+=("$file")
              done < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- 'news/inbox/*.json')
            else
              while IFS= read -r file; do
                [[ -n "$file" ]] && files+=("$file")
              done < <(git show --pretty='' --name-only "$GITHUB_SHA" -- 'news/inbox/*.json')
            fi
          fi

          if (( ${#files[@]} == 0 )); then
            echo "No news JSON files selected; nothing to publish."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Selected file does not exist: $file" >&2
              exit 1
            fi
          done

          printf '%s\n' "${files[@]}" | sort -u > "$RUNNER_TEMP/news-files.txt"
          echo "Selected files:"
          cat "$RUNNER_TEMP/news-files.txt"
          echo "has_files=true" >> "$GITHUB_OUTPUT"

      - name: Validate news JSON
        if: steps.select.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            python3 - "$file" <<'PY'
          import json
          import pathlib
          import re
          import sys
          from datetime import date

          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise SystemExit(f"{path}: root must be an object")
          if not isinstance(data.get("items"), list) or not data["items"]:
              raise SystemExit(f"{path}: items must be a non-empty array")
          if len(data["items"]) > 20:
              raise SystemExit(f"{path}: items must contain at most 20 entries")

          file_date = path.stem
          try:
              date.fromisoformat(file_date)
          except ValueError as exc:
              raise SystemExit(f"{path}: filename must be YYYY-MM-DD.json") from exc

          if data.get("date") not in (None, file_date):
              raise SystemExit(f"{path}: date must match filename ({file_date})")

          seen = set()
          allowed_categories = {"pqc", "protocol", "standards", "security", "ai", "industry", "daily", "test"}
          allowed_statuses = {"draft", "published"}

          for index, item in enumerate(data["items"], start=1):
              if not isinstance(item, dict):
                  raise SystemExit(f"{path}: item #{index} must be an object")
              for field in ("slug", "title", "content"):
                  if not isinstance(item.get(field), str) or not item[field].strip():
                      raise SystemExit(f"{path}: item #{index} missing {field}")
              slug = item["slug"].strip().lower()
              if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug):
                  raise SystemExit(f"{path}: item #{index} has invalid slug: {slug}")
              if slug in seen:
                  raise SystemExit(f"{path}: duplicate slug in payload: {slug}")
              seen.add(slug)
              category = item.get("category", "daily")
              if category not in allowed_categories:
                  raise SystemExit(f"{path}: item #{index} has unsupported category: {category}")
              status = item.get("status", "published")
              if status not in allowed_statuses:
                  raise SystemExit(f"{path}: item #{index} has unsupported status: {status}")

          print(f"Validated {path}: {len(data['items'])} item(s)")
          PY
          done < "$RUNNER_TEMP/news-files.txt"

      - name: Publish to Worker
        if: steps.select.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$NEWS_ADMIN_TOKEN" ]]; then
            echo "Repository secret NEWS_ADMIN_TOKEN is not configured." >&2
            exit 1
          fi

          while IFS= read -r file; do
            echo "Publishing $file"
            response_file="$(mktemp)"

            set +e
            http_code="$(curl \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 90 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $NEWS_ADMIN_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$file" \
              "$NEWS_API_URL")"
            curl_status=$?
            set -e

            if (( curl_status != 0 )); then
              echo "Request failed before receiving a valid HTTP response." >&2
              cat "$response_file" >&2 || true
              exit "$curl_status"
            fi

            cat "$response_file"
            echo

            if [[ ! "$http_code" =~ ^2 ]]; then
              echo "Publish failed with HTTP $http_code" >&2
              exit 1
            fi

            python3 - "$response_file" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"Worker response is not valid JSON: {exc}") from exc
          if data.get("ok") is not True:
              raise SystemExit(f"Worker did not confirm success: {data}")
          print(
              "Published:",
              f"inserted={data.get('inserted', 0)}",
              f"updated={data.get('updated', 0)}",
              f"skipped={data.get('skipped', 0)}",
          )
          PY
          done < "$RUNNER_TEMP/news-files.txt"
