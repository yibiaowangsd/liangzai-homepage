name: Retry selected NGCC timeout parameters

on:
  push:
    branches: [feat/ngcc-timeout-targets]
    paths:
      - '.github/workflows/ngcc-timeout-targets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: comet-5
            id: sign-11
            from: 5
            to: 6
          - name: sig-18-last
            id: sign-18
            from: 3
            to: 4
          - name: vdoo-last
            id: sign-33
            from: 2
            to: 3
    env:
      NGCC_NATIVE_SECONDS: 150
      NGCC_NATIVE_BUDGET: 230
      NGCC_INDEX_FROM: ${{ matrix.from }}
      NGCC_INDEX_TO: ${{ matrix.to }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ngcc-dev/ngcc-harness
          ref: c5261784ef27e7363b1bbace3d687932fda35ccd
          path: ngcc-harness
          sparse-checkout: |
            /api/
            /${{ matrix.id }}/
          sparse-checkout-cone-mode: false
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.10'
      - name: Run original KAT and bounded WASM rebuild
        run: bash scripts/run-ngcc-batch.sh "${{ matrix.id }}" ngcc-harness
      - name: Give every parameter chunk a distinct results file
        if: always()
        run: |
          if [[ -f work/ngcc-wasm-rebuild/${{ matrix.id }}.results.json ]]; then
            mv work/ngcc-wasm-rebuild/${{ matrix.id }}.results.json work/ngcc-wasm-rebuild/${{ matrix.name }}.results.json
          fi
      - name: Package paired modules and bounded attempt logs
        if: always()
        shell: bash
        run: |
          mkdir -p work/ngcc-package/public/pqc-practice/wasm work/ngcc-package/work
          for path in public/pqc-practice/wasm/ngcc-${{ matrix.id }}-*.mjs public/pqc-practice/wasm/ngcc-${{ matrix.id }}-*.wasm; do
            if [[ -f $path ]]; then cp "$path" work/ngcc-package/public/pqc-practice/wasm/; fi
          done
          if [[ -d work/ngcc-wasm-rebuild ]]; then cp -a work/ngcc-wasm-rebuild work/ngcc-package/work/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngcc-official-${{ matrix.name }}
          path: work/ngcc-package/
          if-no-files-found: ignore

  publish:
    needs: rebuild
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ngcc-timeout-targets
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: 'ngcc-official-*'
          merge-multiple: true
          path: .
      - name: Verify aggregate and publish only paired modules
        run: |
          python3 scripts/aggregate-ngcc-rebuild.py
          node --test tests/ngcc-catalog.test.mjs
          node --check public/pqc-practice/ngcc-runtime.js
          node --check public/pqc-practice/ngcc-kex-runtime.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/pqc-practice/wasm/ public/pqc-practice/ngcc-runtime.js public/pqc-practice/ngcc-hash-runtime.js public/pqc-practice/ngcc-kex-runtime.js public/pqc-practice/ngcc-build-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish KAT-verified NGCC public-key source builds'
            git push origin HEAD:feat/ngcc-timeout-targets
          fi
